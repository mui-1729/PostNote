name: Temporary dependency build validation (stub env)
on:
  push:
    branches: [security/nextjs-oct-2026]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-not-a-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/nextjs-oct-2026
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build with nonfunctional placeholder Supabase config
        run: npm run build
      - name: Remove temporary build validation workflow
        if: always()
        run: |
          git rm .github/workflows/security-build-env-check-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary security build validation"
          git push origin HEAD:security/nextjs-oct-2026
